<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>conversor</title>
</head>
<body>
  <h2>conversor de unidades</h2>
  <input type="number" id="coso1" oninput="convertir()">
  <select id="coso2" onchange="convertir()">
    <option value="km">kilometro</option>
    <option value="m">metro</option>
    <option value="cm">centimetro</option>
  </select>
  <select id="coso3" onchange="convertir()">
    <option value="m">metro</option>
    <option value="km">kilometro</option>
    <option value="cm">centimetro</option>
  </select>
  <p id="resultado"></p>

  <script>
    function convertir() {
      let v = document.getElementById("coso1").value;
      let de = document.getElementById("coso2").value;
      let a = document.getElementById("coso3").value;
      let res = 0;
      if (v === "") {
        document.getElementById("resultado").innerText = "";
        return;
      }
      v = Number(v);
      let metros = 0;
      if (de === "km") {
        metros = v * 1000;
      } else if (de === "m") {
        metros = v;
      } else if (de === "cm") {
        metros = v / 100;
      }
      if (a === "km") {
        res = metros / 1000;
      } else if (a === "m") {
        res = metros;
      } else if (a === "cm") {
        res = metros * 100;
      }
      document.getElementById("resultado").innerText = res;
    }
  </script>
</body>
</html>
